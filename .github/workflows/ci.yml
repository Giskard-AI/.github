name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          collect: all
          persona: pedantic
          version: "1.32.0"

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.221.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate Renovate presets
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: >-
          npx --yes --package "renovate@${RENOVATE_VERSION}" --
          renovate-config-validator --strict --no-global
          default.json automerge.json renovate.json
